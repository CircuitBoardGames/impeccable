# The org fork's gate (CircuitBoardGames/ClaudeCode#1264). Upstream's .github/workflows need
# Bun, Rust and live e2e keys this forge does not have; a present .forgejo directory makes the
# forge run THIS instead of them. It checks what the hub vendors from this fork: agent and skill
# frontmatter, and that no agent depends on a plugin-only path.
name: Gate
on:
  pull_request:
  workflow_dispatch:
jobs:
  skill-pack:
    name: skill-pack (vendored surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agents and skills parse, and no agent needs a plugin install
        run: python3 .forgejo/gate.py
